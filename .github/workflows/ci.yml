name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Node.js Docker image
        run: docker build -f Dockerfile.node -t nexusalloc-server .

      - name: Build Python Docker image
        run: docker build -f Dockerfile.python -t nexusalloc-ml .
